name: Build Okvy MusiQ APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Copy web assets
        run: |
          mkdir -p www
          cp src/index.html www/

      - name: Add Android platform
        run: npx cap add android

      - name: Inject Android permissions
        run: |
          python3 -c "
          manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest, 'r') as f:
              content = f.read()
          perms = '    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />\n    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />\n'
          content = content.replace('</manifest>', perms + '</manifest>')
          content = content.replace('android:label=\"Okvy MusiQ\"', 'android:label=\"Okvy MusiQ\" android:usesCleartextTraffic=\"true\"')
          content = content.replace('android:name=\"com.okvy.musiq.MainActivity\"', 'android:name=\"com.okvy.musiq.MainActivity\" android:windowSoftInputMode=\"adjustResize\"')
          with open(manifest, 'w') as f:
              f.write(content)
          print('Manifest updated')
          "

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: okvy-musiq-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
