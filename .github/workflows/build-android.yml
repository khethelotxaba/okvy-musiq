name: Build Okvy MusiQ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Node.js 24
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      # 3. Java 17
      # setup-java@v5 is the ACTION version.
      # Java itself remains JDK 17 for the Android build.
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 4. Confirm the toolchain
      - name: Verify toolchain
        run: |
          echo "Node:"
          node --version
          echo "NPM:"
          npm --version
          echo "Java:"
          java --version

      # 5. Install project dependencies
      # No npm ci because this repository currently has no package-lock.json.
      - name: Install web/native dependencies
        run: npm install

      # 6. Generate the Android project
      - name: Generate Android project
        run: npx cap add android

      # 7. Copy the web app into Android
      - name: Sync web assets
        run: npx cap sync android

      # 8. Add Okvy MusiQ native media scanner,
      # artwork extraction and playback bridge
      - name: Add native media scanner and playback bridge
        run: node scripts/prepare-android.mjs

      # 9. Verify that the native Android files actually exist
      - name: Verify Android project and native plugin
        working-directory: android
        run: |
          test -f app/src/main/java/com/okvymusiq/app/NativeMediaPlugin.java
          test -f app/src/main/java/com/okvymusiq/app/NativePlaybackService.java
          test -f app/src/main/java/com/okvymusiq/app/MainActivity.java

          grep -q 'NativeMediaPlugin' \
            app/src/main/java/com/okvymusiq/app/MainActivity.java

          grep -q 'NativeMediaPlugin' \
            capacitor.config.json

          chmod +x gradlew

          ./gradlew --version

      # 10. Build the debug APK
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 11. Upload the APK to GitHub Actions Artifacts
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: okvy-musiq-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
