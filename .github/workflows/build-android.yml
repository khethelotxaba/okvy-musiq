name: Build Okvy MusiQ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify toolchain
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Java:"
          java --version

      - name: Install web/native dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor configuration
        run: |
          test -f capacitor.config.json
          echo "capacitor.config.json found."
          cat capacitor.config.json

      - name: Prepare web assets
        run: |
          npm run build

          test -f www/index.html
          echo "www/index.html found."

          echo "Web directory:"
          find www -maxdepth 2 -type f | sort

      - name: Generate Android project
        run: |
          npx cap add android

      - name: Verify Android project was generated
        run: |
          test -d android
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android project generated successfully."

      - name: Sync Capacitor Android project
        run: |
          npx cap sync android

      - name: Verify Capacitor generated assets
        run: |
          test -f android/app/src/main/assets/capacitor.plugins.json
          echo "Capacitor plugin metadata found."

      - name: Add native media scanner and playback bridge
        run: |
          node scripts/prepare-android.mjs

      - name: Verify Android project and native integration
        working-directory: android
        run: |
          echo "Checking native files..."

          test -f app/src/main/java/com/okvymusiq/app/NativeMediaPlugin.java
          test -f app/src/main/java/com/okvymusiq/app/NativePlaybackService.java
          test -f app/src/main/java/com/okvymusiq/app/MainActivity.java

          echo "Checking MainActivity registration..."

          grep -q 'NativeMediaPlugin' \
            app/src/main/java/com/okvymusiq/app/MainActivity.java

          echo "Checking foreground playback service..."

          grep -q 'NativePlaybackService' \
            app/src/main/AndroidManifest.xml

          echo "Checking audio permission..."

          grep -q 'READ_MEDIA_AUDIO' \
            app/src/main/AndroidManifest.xml

          echo "Checking foreground media playback permission..."

          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' \
            app/src/main/AndroidManifest.xml

          echo "Making Gradle executable..."

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

          echo "Android project verification passed."

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk

          echo "APK successfully built:"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: okvy-musiq-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
