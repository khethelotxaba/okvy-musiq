name: Build Okvy MusiQ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify toolchain
        run: |
          echo "Node:"
          node --version
          echo "NPM:"
          npm --version
          echo "Java:"
          java --version

      - name: Install web/native dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Add native media scanner and playback bridge
        run: node scripts/prepare-android.mjs

      - name: Verify Android project and native plugin
        working-directory: android
        run: |
          test -f app/src/main/java/com/okvymusiq/app/NativeMediaPlugin.java
          test -f app/src/main/java/com/okvymusiq/app/NativePlaybackService.java
          test -f app/src/main/java/com/okvymusiq/app/MainActivity.java

          grep -q 'NativeMediaPlugin' \
            app/src/main/java/com/okvymusiq/app/MainActivity.java

          grep -q 'NativeMediaPlugin' \
            capacitor.config.json

          chmod +x gradlew

          ./gradlew --version

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: okvy-musiq-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
