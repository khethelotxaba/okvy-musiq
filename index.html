<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Okvy MusiQ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      }
    </script>
<base target="_blank">
</head>
<body>
    <div id="critical-error" class="critical-error hidden">
        <div class="error-glass">
            <div class="error-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3.5c-.5 0-.97.27-1.24.73L2.9 17.8c-.53.9.12 2.03 1.17 2.03h15.86c1.05 0 1.7-1.13 1.17-2.03L13.24 4.23A1.44 1.44 0 0 0 12 3.5z" stroke-linejoin="round"/><path d="M12 9.25v4.25" stroke-linecap="round"/><circle cx="12" cy="16.75" r="0.9" fill="currentColor" stroke="none"/>
                </svg>
            </div>
            <h2>Something went wrong</h2>
            <p id="error-message">The app failed to initialize.</p>
            <button onclick="location.reload()" class="btn-gold">Reload App</button>
        </div>
    </div>

    <canvas id="particles-canvas"></canvas>

    <div id="app" class="app">
        <aside id="sidebar" class="sidebar" aria-label="Main navigation">
            <div class="sidebar-blur"></div>
            <div class="sidebar-content">
                <div class="sidebar-header">
                    <div class="logo">
                        <div class="logo-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <polygon points="10 8 16 12 10 16 10 8"/>
                            </svg>
                        </div>
                        <span class="logo-text">Okvy<span class="gold">MusiQ</span></span>
                    </div>
                    <button id="close-sidebar" class="icon-btn" aria-label="Close menu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>

                <nav class="nav-menu">
                    <a href="#home" class="nav-item active" data-page="home">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.8 12 4l8 6.8V19a2 2 0 0 1-2 2h-3.2v-6.2H9.2V21H6a2 2 0 0 1-2-2z" stroke-linejoin="round"/></svg>
                        <span>Home</span>
                    </a>
                    <a href="#search" class="nav-item" data-page="search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.6" cy="10.6" r="7.1"/><path d="M20.5 20.5l-4.35-4.35"/></svg>
                        <span>Search</span>
                    </a>
                    <a href="#library" class="nav-item" data-page="tracks">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.75V12l3 1.75" stroke-linecap="round"/></svg>
                        <span>Tracks</span>
                    </a>
                    <a href="#albums" class="nav-item" data-page="albums">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4" stroke-linejoin="round"/><circle cx="9" cy="9" r="1.6"/><path d="M21 15.5 16.3 11 6 21" stroke-linejoin="round"/></svg>
                        <span>Albums</span>
                    </a>
                    <a href="#artists" class="nav-item" data-page="artists">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-1.6a4.4 4.4 0 0 0-4.4-4.4H9.4A4.4 4.4 0 0 0 5 19.4V21" stroke-linecap="round"/><circle cx="12" cy="7.3" r="3.8"/></svg>
                        <span>Artists</span>
                    </a>
                    <a href="#genres" class="nav-item" data-page="genres">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 17.8V6.4l11-2v11.2" stroke-linejoin="round"/><circle cx="6.4" cy="17.8" r="2.8"/><circle cx="17.4" cy="15.8" r="2.8"/></svg>
                        <span>Genres</span>
                    </a>
                    <a href="#playlists" class="nav-item" data-page="playlists">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4" stroke-linejoin="round"/><path d="M8.5 9h7M8.5 15h7" stroke-linecap="round"/></svg>
                        <span>Playlists</span>
                    </a>
                    <a href="#queue" class="nav-item" data-page="queue">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6h11M9.5 12h11M9.5 18h11" stroke-linecap="round"/><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
                        <span>Queue</span>
                    </a>
                    <a href="#folders" class="nav-item" data-page="folders">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.4c0-1.6 1.3-2.9 2.9-2.9h3.4l1.9 2.2h7.9c1.6 0 2.9 1.3 2.9 2.9v6.6c0 1.6-1.3 2.9-2.9 2.9H5.4c-1.6 0-2.9-1.3-2.9-2.9z" stroke-linejoin="round"/></svg>
                        <span>Folders</span>
                    </a>
                    <a href="#favorites" class="nav-item" data-page="favorites">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.1c-.28 0-.55-.08-.78-.23C7.2 17.1 3.3 13.9 3.3 9.9c0-2.9 2.3-5.2 5.1-5.2 1.7 0 3.2.83 4.1 2.1a5.02 5.02 0 0 1 4.1-2.1c2.8 0 5.1 2.3 5.1 5.2 0 4-3.9 7.2-7.92 10-.23.15-.5.23-.78.23z" stroke-linejoin="round"/></svg>
                        <span>Favorites</span>
                    </a>
                    <a href="#settings" class="nav-item" data-page="settings">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.8"/><path d="M12 3.5v2.1M12 18.4v2.1M20.5 12h-2.1M5.6 12H3.5M17.8 6.2l-1.5 1.5M7.7 16.3l-1.5 1.5M17.8 17.8l-1.5-1.5M7.7 7.7 6.2 6.2" stroke-linecap="round"/></svg>
                        <span>Settings</span>
                    </a>
                </nav>

                <div class="sidebar-section">
                    <h3 class="section-label">Your Playlists</h3>
                    <div id="user-playlists" class="playlist-list"></div>
                </div>

                <div class="sidebar-footer">
                    <div class="mini-player-sidebar">
                        <img id="sidebar-art" src="assets/default-art.png" alt="" class="mini-art">
                        <div class="mini-info">
                            <span id="sidebar-title" class="mini-title">Not Playing</span>
                            <span id="sidebar-artist" class="mini-artist">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <main class="main-content">
            <header class="top-bar">
                <button id="menu-toggle" class="icon-btn menu-btn" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h13M4 17h16" stroke-linecap="round"/></svg>
                </button>
                <h1 id="page-title" class="page-title">Home</h1>
                <button id="search-toggle" class="icon-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.6" cy="10.6" r="7.1"/><path d="M20.5 20.5l-4.35-4.35"/></svg>
                </button>
            </header>

            <div id="page-container" class="page-container"></div>
        </main>

        <div id="now-playing-bar" class="now-playing-bar hidden">
            <div class="np-progress-container"><div id="np-progress" class="np-progress"></div></div>
            <div class="np-content">
                <div class="np-track" id="np-track">
                    <img id="np-art" src="assets/default-art.png" alt="" class="np-art">
                    <div class="np-info">
                        <span id="np-title" class="np-title">Select a song</span>
                        <span id="np-artist" class="np-artist">-</span>
                    </div>
                </div>
                <div class="np-controls">
                    <button id="np-prev" class="control-btn" aria-label="Previous">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 6.2c.7-.5 1.7 0 1.7 .9v9.8c0 .9-1 1.4-1.7 .9L11 13.1c-.6-.5-.6-1.4 0-1.9z" fill="currentColor" stroke="none"/><rect x="5.3" y="6" width="1.9" height="12" rx="0.9" fill="currentColor" stroke="none"/></svg>
                    </button>
                    <button id="np-play" class="control-btn play-btn" aria-label="Play/Pause">
                        <svg id="np-play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.2 5.9c0-1.4 1.55-2.28 2.76-1.55l9 5.5a1.85 1.85 0 0 1 0 3.2l-9 5.5c-1.21.73-2.76-.15-2.76-1.55z" fill="currentColor" stroke="none"/></svg>
                    </button>
                    <button id="np-next" class="control-btn" aria-label="Next">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.2c-.7-.5-1.7 0-1.7 .9v9.8c0 .9 1 1.4 1.7 .9L13 13.1c.6-.5 .6-1.4 0-1.9z" fill="currentColor" stroke="none"/><rect x="16.8" y="6" width="1.9" height="12" rx="0.9" fill="currentColor" stroke="none"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="full-player" class="full-player">
            <div class="fp-backdrop"></div>
            <div class="fp-sheet">
                <div class="fp-handle"><div class="fp-handle-bar"></div></div>
                <div class="fp-content">
                    <button id="fp-close" class="fp-close-btn" aria-label="Close player">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.3 6.7 6.7 17.3M6.7 6.7l10.6 10.6" stroke-linecap="round"/></svg>
                        <span>Now Playing</span>
                    </button>

                    <div class="fp-art-container">
                        <img id="fp-art" src="assets/default-art.png" alt="" class="fp-art">
                    </div>

                    <div class="fp-meta">
                        <div class="fp-text">
                            <h2 id="fp-title" class="fp-title">Title</h2>
                            <p id="fp-artist" class="fp-artist">Artist</p>
                        </div>
                        <button id="fp-favorite" class="fp-favorite-btn" aria-label="Add to favorites">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.1c-.28 0-.55-.08-.78-.23C7.2 17.1 3.3 13.9 3.3 9.9c0-2.9 2.3-5.2 5.1-5.2 1.7 0 3.2.83 4.1 2.1a5.02 5.02 0 0 1 4.1-2.1c2.8 0 5.1 2.3 5.1 5.2 0 4-3.9 7.2-7.92 10-.23.15-.5.23-.78.23z" stroke-linejoin="round"/></svg>
                        </button>
                    </div>

                    <div class="waveform-container" id="waveform-container" style="display:none;">
                        <canvas id="waveform-canvas"></canvas>
                    </div>

                    <div class="fp-progress-section">
                        <div class="progress-bar-container" id="fp-progress-container">
                            <div class="progress-track">
                                <div id="fp-progress-bar" class="progress-bar"></div>
                                <div id="fp-progress-handle" class="progress-handle"></div>
                            </div>
                        </div>
                        <div class="time-display">
                            <span id="fp-current">0:00</span>
                            <span id="fp-duration">0:00</span>
                        </div>
                    </div>

                    <div class="fp-controls">
                        <button id="fp-shuffle" class="control-btn secondary" aria-label="Shuffle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.2 3.5h4.3v4.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19.5 20.5 3.5" stroke-linecap="round"/><path d="M20.5 15.7v4.3h-4.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 14.5l6 5.5" stroke-linecap="round"/><path d="M4 4.5l4.5 4.5" stroke-linecap="round"/></svg>
                        </button>
                        <button id="fp-prev" class="control-btn" aria-label="Previous">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 6.2c.7-.5 1.7 0 1.7 .9v9.8c0 .9-1 1.4-1.7 .9L11 13.1c-.6-.5-.6-1.4 0-1.9z" fill="currentColor" stroke="none"/><rect x="5.3" y="6" width="1.9" height="12" rx="0.9" fill="currentColor" stroke="none"/></svg>
                        </button>
                        <button id="fp-play" class="control-btn play-btn large" aria-label="Play/Pause">
                            <svg id="fp-play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.2 5.9c0-1.4 1.55-2.28 2.76-1.55l9 5.5a1.85 1.85 0 0 1 0 3.2l-9 5.5c-1.21.73-2.76-.15-2.76-1.55z" fill="currentColor" stroke="none"/></svg>
                        </button>
                        <button id="fp-next" class="control-btn" aria-label="Next">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.2c-.7-.5-1.7 0-1.7 .9v9.8c0 .9 1 1.4 1.7 .9L13 13.1c.6-.5 .6-1.4 0-1.9z" fill="currentColor" stroke="none"/><rect x="16.8" y="6" width="1.9" height="12" rx="0.9" fill="currentColor" stroke="none"/></svg>
                        </button>
                        <button id="fp-repeat" class="control-btn secondary" aria-label="Repeat">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.2 20.5 5.7 17 9.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.2 11.2V9.7a4.5 4.5 0 0 1 4.5-4.5h12.8" stroke-linecap="round"/><path d="M7 21.8 3.5 18.3 7 14.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.8 12.8v1.5a4.5 4.5 0 0 1-4.5 4.5H3.5" stroke-linecap="round"/></svg>
                        </button>
                    </div>

                    <div class="fp-actions">
                        <button id="fp-lyrics-btn" onclick="UI.navigate('lyrics')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.2 2.3H6.4A2.1 2.1 0 0 0 4.3 4.4v15.2a2.1 2.1 0 0 0 2.1 2.1h11.2a2.1 2.1 0 0 0 2.1-2.1V8.1z" stroke-linejoin="round"/><path d="M14.2 2.3V8.1h5.5M8 13h8M8 17h8" stroke-linecap="round"/></svg>
                            Lyrics
                        </button>
                        <button id="fp-add">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4" stroke-linejoin="round"/><path d="M12 8.2v7.6M8.2 12h7.6" stroke-linecap="round"/></svg>
                            Playlist
                        </button>
                        <button id="fp-share">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18.2" cy="5.2" r="2.6"/><circle cx="5.8" cy="12" r="2.6"/><circle cx="18.2" cy="18.8" r="2.6"/><path d="M8.1 13.4l7.6 4M15.7 6.6l-7.6 3.9" stroke-linecap="round"/></svg>
                            Share
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <nav class="tab-bar">
            <button class="tab-btn active" data-tab="home" aria-label="Home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.8 12 4l8 6.8V19a2 2 0 0 1-2 2h-3.2v-6.2H9.2V21H6a2 2 0 0 1-2-2z" stroke-linejoin="round"/></svg>
                <span>Home</span>
            </button>
            <button class="tab-btn" data-tab="tracks" aria-label="Library">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.75V12l3 1.75" stroke-linecap="round"/></svg>
                <span>Library</span>
            </button>
            <button class="tab-btn" data-tab="search" aria-label="Search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.6" cy="10.6" r="7.1"/><path d="M20.5 20.5l-4.35-4.35"/></svg>
                <span>Search</span>
            </button>
            <button class="tab-btn" data-tab="settings" aria-label="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.8"/><path d="M12 3.5v2.1M12 18.4v2.1M20.5 12h-2.1M5.6 12H3.5M17.8 6.2l-1.5 1.5M7.7 16.3l-1.5 1.5M17.8 17.8l-1.5-1.5M7.7 7.7 6.2 6.2" stroke-linecap="round"/></svg>
                <span>Settings</span>
            </button>
        </nav>

        <div id="playlist-modal" class="modal">
            <div class="modal-sheet">
                <div class="modal-header">
                    <h3>Add to Playlist</h3>
                    <button id="close-playlist-modal" class="icon-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.3 6.7 6.7 17.3M6.7 6.7l10.6 10.6" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <div id="playlist-modal-list" class="modal-list"></div>
                <button id="create-playlist-btn" class="btn-gold btn-full">Create New Playlist</button>
            </div>
        </div>

        <div id="track-menu-modal" class="modal">
            <div class="modal-sheet">
                <div class="modal-header">
                    <h3>Track Options</h3>
                    <button id="close-track-menu" class="icon-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.3 6.7 6.7 17.3M6.7 6.7l10.6 10.6" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <div id="track-menu-list" class="modal-list"></div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script>
        window.onerror = function(msg, url, line, col, error) {
            console.error('Global error:', msg, 'at', url, line, col);
            if (msg && (msg.includes('SyntaxError') || msg.includes('Module') || msg.includes('import'))) {
                document.getElementById('critical-error').classList.remove('hidden');
                document.getElementById('error-message').textContent = msg + ' (Line ' + line + ')';
                document.getElementById('app').style.display = 'none';
            }
            return true;
        };
        window.onunhandledrejection = function(event) {
            console.error('Unhandled rejection:', event.reason);
            const reason = event.reason;
            const msg = reason?.message || String(reason);
            if (msg.includes('no supported source') || msg.includes('Failed to load') || msg.includes('audio') || msg.includes('blob')) {
                console.warn('Audio source error (non-fatal):', msg);
                event.preventDefault();
                return;
            }
            if (msg.includes('SyntaxError') || msg.includes('Module') || msg.includes('import') || msg.includes('undefined is not a function')) {
                document.getElementById('critical-error').classList.remove('hidden');
                document.getElementById('error-message').textContent = 'Promise error: ' + msg;
                document.getElementById('app').style.display = 'none';
            }
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/data.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
