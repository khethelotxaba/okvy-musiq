<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Okvy MusiQ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(console.error);
  }
</script>
</head>
<body>
    <!-- Critical Error Fallback -->
    <div id="critical-error" class="critical-error hidden">
        <div class="error-glass">
            <div class="error-icon">⚠️</div>
            <h2>Something went wrong</h2>
            <p id="error-message">The app failed to initialize.</p>
            <button onclick="location.reload()" class="btn-gold">Reload App</button>
        </div>
    </div>

    <!-- App Container -->
    <div id="app" class="app">
        <!-- Side Navigation -->
        <aside id="sidebar" class="sidebar" aria-label="Main navigation">
            <div class="sidebar-blur"></div>
            <div class="sidebar-content">
                <div class="sidebar-header">
                    <div class="logo">
                        <div class="logo-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <polygon points="10 8 16 12 10 16 10 8"/>
                            </svg>
                        </div>
                        <span class="logo-text">Okvy<span class="gold">MusiQ</span></span>
                    </div>
                    <button id="close-sidebar" class="icon-btn" aria-label="Close menu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>

                <nav class="nav-menu">
                    <a href="#home" class="nav-item active" data-page="home">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        <span>Home</span>
                    </a>
                    <a href="#search" class="nav-item" data-page="search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <span>Search</span>
                    </a>
                    <a href="#library" class="nav-item" data-page="library">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/>
                            <path d="M12 7v6l4 2"/>
                        </svg>
                        <span>Library</span>
                    </a>
                    <a href="#favorites" class="nav-item" data-page="favorites">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                        <span>Favorites</span>
                    </a>
                    <a href="#playlists" class="nav-item" data-page="playlists">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <line x1="9" y1="9" x2="15" y2="9"/>
                            <line x1="9" y1="15" x2="15" y2="15"/>
                        </svg>
                        <span>Playlists</span>
                    </a>
                </nav>

                <div class="sidebar-section">
                    <h3 class="section-label">Your Playlists</h3>
                    <div id="user-playlists" class="playlist-list">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <div class="sidebar-footer">
                    <div class="mini-player-sidebar">
                        <img id="sidebar-art" src="" alt="" class="mini-art">
                        <div class="mini-info">
                            <span id="sidebar-title" class="mini-title">Not Playing</span>
                            <span id="sidebar-artist" class="mini-artist">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Sidebar Overlay -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <button id="menu-toggle" class="icon-btn" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <h1 id="page-title" class="page-title">Home</h1>
                <button id="search-toggle" class="icon-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
            </header>

            <!-- Page Container -->
            <div id="page-container" class="page-container">
                <!-- Pages injected by JS -->
            </div>
        </main>

        <!-- Now Playing Bar -->
        <div id="now-playing-bar" class="now-playing-bar">
            <div class="np-progress-container">
                <div id="np-progress" class="np-progress"></div>
            </div>
            <div class="np-content">
                <div class="np-track" id="np-track">
                    <img id="np-art" src="" alt="" class="np-art">
                    <div class="np-info">
                        <span id="np-title" class="np-title">Select a song</span>
                        <span id="np-artist" class="np-artist">-</span>
                    </div>
                </div>
                <div class="np-controls">
                    <button id="np-prev" class="control-btn" aria-label="Previous">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                        </svg>
                    </button>
                    <button id="np-play" class="control-btn play-btn" aria-label="Play/Pause">
                        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="pause-icon" class="hidden" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>
                    <button id="np-next" class="control-btn" aria-label="Next">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Full Player Modal -->
        <div id="full-player" class="full-player">
            <div class="full-player-bg">
                <img id="fp-bg-img" src="" alt="">
                <div class="full-player-blur"></div>
            </div>
            <div class="full-player-content">
                <button id="fp-close" class="icon-btn fp-close" aria-label="Close player">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>

                <div class="fp-art-container">
                    <img id="fp-art" src="" alt="" class="fp-art">
                </div>

                <div class="fp-info">
                    <h2 id="fp-title" class="fp-title">Title</h2>
                    <p id="fp-artist" class="fp-artist">Artist</p>
                </div>

                <div class="fp-progress-section">
                    <div class="progress-bar-container" id="fp-progress-container">
                        <div id="fp-progress-bar" class="progress-bar"></div>
                        <div id="fp-progress-handle" class="progress-handle"></div>
                    </div>
                    <div class="time-display">
                        <span id="fp-current">0:00</span>
                        <span id="fp-duration">0:00</span>
                    </div>
                </div>

                <div class="fp-controls">
                    <button id="fp-shuffle" class="control-btn secondary" aria-label="Shuffle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 3 21 3 21 8"/>
                            <line x1="4" y1="20" x2="21" y2="3"/>
                            <polyline points="21 16 21 21 16 21"/>
                            <line x1="15" y1="15" x2="21" y2="21"/>
                            <line x1="4" y1="4" x2="9" y2="9"/>
                        </svg>
                    </button>
                    <button id="fp-prev" class="control-btn" aria-label="Previous">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                        </svg>
                    </button>
                    <button id="fp-play" class="control-btn play-btn large" aria-label="Play/Pause">
                        <svg id="fp-play-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="fp-pause-icon" class="hidden" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>
                    <button id="fp-next" class="control-btn" aria-label="Next">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                        </svg>
                    </button>
                    <button id="fp-repeat" class="control-btn secondary" aria-label="Repeat">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="17 1 21 5 17 9"/>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                            <polyline points="7 23 3 19 7 15"/>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                        </svg>
                    </button>
                </div>

                <div class="fp-actions">
                    <button id="fp-favorite" class="action-btn" aria-label="Add to favorites">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                    </button>
                    <button id="fp-add" class="action-btn" aria-label="Add to playlist">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <line x1="12" y1="8" x2="12" y2="16"/>
                            <line x1="8" y1="12" x2="16" y2="12"/>
                        </svg>
                    </button>
                    <button id="fp-share" class="action-btn" aria-label="Share">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="18" cy="5" r="3"/>
                            <circle cx="6" cy="12" r="3"/>
                            <circle cx="18" cy="19" r="3"/>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Add to Playlist Modal -->
        <div id="playlist-modal" class="modal">
            <div class="modal-glass">
                <div class="modal-header">
                    <h3>Add to Playlist</h3>
                    <button id="close-playlist-modal" class="icon-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div id="playlist-modal-list" class="modal-list"></div>
                <button id="create-playlist-btn" class="btn-gold btn-full">Create New Playlist</button>
            </div>
        </div>
    </div>

    <!-- Scripts loaded with error handling -->
    <script>
        window.onerror = function(msg, url, line, col, error) {
            console.error('Global error:', msg, 'at', url, line, col);
            document.getElementById('critical-error').classList.remove('hidden');
            document.getElementById('error-message').textContent = msg + ' (Line ' + line + ')';
            document.getElementById('app').style.display = 'none';
            return true;
        };
        window.onunhandledrejection = function(event) {
            console.error('Unhandled rejection:', event.reason);
            document.getElementById('critical-error').classList.remove('hidden');
            document.getElementById('error-message').textContent = 'Promise error: ' + (event.reason?.message || 'Unknown');
            document.getElementById('app').style.display = 'none';
        };
    </script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
